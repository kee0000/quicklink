<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keelan's Stuff</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #131314;
            color: #ddd;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }

        #main-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        #login-gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 360px;
        }

        #login-gate h1 {
            font-size: 2em;
            font-weight: 700;
            margin: 0;
        }

        #password-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            font-family: inherit;
            background-color: #1E1F20;
            color: #fff;
            border: 1px solid #2e3032;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
        }

        #password-input:focus {
            outline: none;
            border-color: #555;
        }

        #unlock-btn {
            width: 100%;
        }

        #error-msg {
            color: #f28b82;
            font-size: 14px;
            margin: 0;
            display: none;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: inherit;
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            width: 100%;
            max-width: 800px;
        }

        button {
            background-color: #1E1F20;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 45%; /* Makes it horizontal in larger screens */
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #282a2c;
        }

        button:active {
            background-color: #282A2C;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }

        /* New styles for the footer text */
        .footer-text {
            color: #555; /* Darker text color */
            font-size: 14px; /* Smaller font size */
            margin-top: 40px; /* Increased spacing above the text */
        }

        /* Media Query: Stack buttons vertically in portrait mode */
        @media (max-width: 600px) {
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div id="login-gate">
    <h1>Enter Password</h1>
    <input type="password" id="password-input" placeholder="Password" onkeydown="handleKey(event)" />
    <button id="unlock-btn" onclick="checkPassword()">
        <span class="material-symbols-outlined">lock_open</span>
        Unlock
    </button>
    <p id="error-msg">Incorrect password</p>
</div>

<div id="main-content">
    <header>
        <h1>Keelan's Stuff</h1>
    </header>

    <div class="container">
        <button onclick="location.href='https://kee0000.github.io/site'">
            <span class="material-symbols-outlined">search</span>
            Search
        </button>
        <button onclick="location.href='https://kee0000.github.io/timer'">
            <span class="material-symbols-outlined">timer</span>
            Timer Tab
        </button>
        <button onclick="location.href='https://thumbnailvault.vercel.app/'">
            <span class="material-symbols-outlined">photo_library</span>
            Thumbnail Vault
        </button>
        <button onclick="location.href='https://fdtrackerkee.vercel.app/'">
            <span class="material-symbols-outlined">restaurant</span>
            Food Tracker
        </button>
        <button onclick="location.href='https://ratethattapwater.vercel.app/'">
            <span class="material-symbols-outlined">water_full</span>
            RateThatTapWater
        </button>
    </div>

    <p class="footer-text">Made by Keelan</p>
</div>

<script>
    const CORRECT_PASSWORD = "conto74";

    if (sessionStorage.getItem("unlocked") === "true") {
        showSite();
    }

    function handleKey(event) {
        if (event.key === "Enter") {
            checkPassword();
        }
    }

    function checkPassword() {
        const input = document.getElementById("password-input").value;
        if (input === CORRECT_PASSWORD) {
            sessionStorage.setItem("unlocked", "true");
            showSite();
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }

    function showSite() {
        document.getElementById("login-gate").style.display = "none";
        document.getElementById("main-content").style.display = "flex";
    }
</script>

</body>
</html>
